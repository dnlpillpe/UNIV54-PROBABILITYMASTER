# Sobrescribe el gradle.properties generado por `flutter create`.
# Solo contiene ajustes que son válidos con cualquier versión de AGP, para no
# atarse a una combinación concreta de Gradle/Kotlin: la versión de Flutter
# está pinchada en el workflow y ella decide el resto (ver docs/05_CI_CD.md).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
